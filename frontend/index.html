<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Datos II</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <div class="main-container">
        <div class="welcome-card">
            <h1>Bienvenido al registro de usuarios</h1>
            <h2>Base de Datos II - Proyecto 1</h2>
            
            <div class="options-container">
                <div class="option-card">
                    <h3><i class="bi bi-box-arrow-in-right"></i> Accede a tu cuenta</h3>
                    <p>Si ya tienes una cuenta, puedes iniciar sesión aquí:</p>
                    <a href="login.html">
                        <button type="button" class="action-button">Iniciar Sesión</button>
                    </a>
                </div>
                
                <div class="option-card">
                    <h3><i class="bi bi-person-plus"></i> ¿Eres un usuario nuevo?</h3>
                    <p>Si es tu primera vez, regístrate para crear tu cuenta:</p>
                    <a href="registro.html">
                        <button type="button" class="action-button">Registrarse</button>
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <footer>
        <p>© 2025 FIE DB2</p>
    </footer>

<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: Arial, sans-serif;
        background-color: #e8f4f8;
    }
    
    .main-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 60px); /* Adjusted height since nav bar is removed */
        padding: 2rem;
    }
    
    .welcome-card {
        background-color: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 12px rgba(56, 125, 172, 0.15);
        padding: 2rem;
        width: 100%;
        max-width: 800px;
        border-top: 4px solid #4a6fa5;
        text-align: center;
    }
    
    h1 {
        color: #2c3e50;
        margin-bottom: 0.5rem;
    }
    
    h2 {
        color: #4a6fa5;
        font-weight: normal;
        margin-bottom: 2rem;
    }
    
    .options-container {
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
        gap: 1.5rem;
    }
    
    .option-card {
        background-color: #f8fbfd;
        border-radius: 6px;
        border: 1px solid #c5d8e8;
        padding: 1.5rem;
        flex: 1;
        min-width: 250px;
        transition: transform 0.3s, box-shadow 0.3s;
    }
    
    .option-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 15px rgba(56, 125, 172, 0.1);
    }
    
    h3 {
        color: #4a6fa5;
        margin-top: 0;
    }
    
    p {
        color: #5a6a7a;
        margin-bottom: 1.5rem;
    }
    
    .action-button {
        width: 100%;
        padding: 0.8rem;
        background-color: #4a6fa5;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    
    .action-button:hover {
        background-color: #395987;
    }
    
    footer {
        text-align: center;
        padding: 1rem;
        background-color: #2c3e50;
        color: #e8f4f8;
    }
    
    @media (max-width: 768px) {
        .options-container {
            flex-direction: column;
        }
        
        .welcome-card {
            width: 90%;
            padding: 1.5rem;
        }
    }
</style>
</body>
</html>
