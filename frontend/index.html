<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Datos II</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <div class="main-container">
        <div class="content-container">
            <div class="content-card">
                <h2>Base de Datos II - Proyecto 1</h2>
                <h3>Bienvenido al sistema de registro de usuarios</h3>
                
                <div class="section">
                    <h4><i class="bi bi-box-arrow-in-right"></i> Accede a tu cuenta</h4>
                    <p>Si ya tienes una cuenta, puedes iniciar sesión aquí:</p>
                    <a href="login.html">
                        <button type="button" class="primary-button">
                            <i class="bi bi-person-check"></i> Iniciar Sesión
                        </button>
                    </a>
                </div>
                
                <div class="section">
                    <h4><i class="bi bi-person-plus"></i> ¿Eres un usuario nuevo?</h4>
                    <p>Si es tu primera vez, regístrate para crear tu cuenta:</p>
                    <a href="registro.html">
                        <button type="button" class="secondary-button">
                            <i class="bi bi-pencil-square"></i> Registrarse
                        </button>
                    </a>
                </div>
                
                <hr>
                <footer>
                    <p>© 2025 FIE DB2</p>
                </footer>
            </div>
        </div>
    </div>
</body>
<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: Arial, sans-serif;
        background-color: #e8f4f8;
    }
    
    .main-container {
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow-y: auto;
    }

    .content-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 2rem 0;
    }

    .content-card {
        background-color: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 12px rgba(56, 125, 172, 0.15);
        padding: 2rem;
        width: 100%;
        max-width: 600px;
        border-top: 4px solid #4a6fa5;
    }

    h2 {
        text-align: center;
        margin-bottom: 0.5rem;
        color: #2c3e50;
    }
    
    h3 {
        text-align: center;
        margin-bottom: 1.5rem;
        color: #4a6fa5;
        font-weight: normal;
        font-size: 1.1rem;
    }
    
    h4 {
        color: #2c3e50;
        margin-bottom: 0.8rem;
    }

    .section {
        margin-bottom: 2rem;
        text-align: center;
    }
    
    p {
        color: #5a6a7a;
        margin-bottom: 1rem;
    }

    .primary-button, .secondary-button {
        padding: 0.8rem 1.5rem;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.3s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-width: 200px;
    }
    
    .primary-button {
        background-color: #4a6fa5;
        color: white;
    }
    
    .primary-button:hover {
        background-color: #395987;
    }
    
    .secondary-button {
        background-color: #6494c4;
        color: white;
    }
    
    .secondary-button:hover {
        background-color: #5080b1;
    }
    
    hr {
        border: none;
        border-top: 1px solid #e0e9f0;
        margin: 2rem 0 1rem;
    }
    
    footer {
        text-align: center;
        color: #8a9aa7;
        font-size: 0.9rem;
    }
    
    @media (max-width: 768px) {
        .content-card {
            width: 90%;
            padding: 1.5rem;
        }
        
        .primary-button, .secondary-button {
            width: 100%;
        }
    }
</style>
</html>
