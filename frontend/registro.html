<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body {
            font-family: 'Share Tech Mono', 'Consolas', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #101a12;
            color: #7afc7a;
        }
        .register-container {
            background: rgba(16, 26, 18, 0.98);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 24px #0f3d0f, 0 0 2px #7afc7a inset;
            width: 100%;
            max-width: 400px;
            border: 1.5px solid #3a5c3a;
        }
        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #7afc7a;
            text-shadow: 0 0 8px #3a5c3a;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #a6ffb6;
            text-shadow: 0 0 2px #3a5c3a;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #3a5c3a;
            border-radius: 4px;
            box-sizing: border-box;
            background: #1a2d1a;
            color: #7afc7a;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }
        input:focus {
            border-color: #7afc7a;
            box-shadow: 0 0 8px #7afc7a44;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #183c18;
            color: #7afc7a;
            border: 1.5px solid #3a5c3a;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            text-shadow: 0 0 4px #3a5c3a;
            transition: background 0.2s, color 0.2s;
        }
        button:hover {
            background: #224d22;
            color: #a6ffb6;
        }
        .error-message {
            color: #ff4f4f;
            text-align: center;
            margin-bottom: 1rem;
            display: none;
        }
        .login-link {
            text-align: center;
            margin-top: 1rem;
        }
        .login-link a {
            color: #7afc7a;
            text-decoration: none;
            text-shadow: 0 0 2px #3a5c3a;
        }
        .login-link a:hover {
            text-decoration: underline;
            color: #a6ffb6;
        }
        /* Efecto scanlines sutil */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(122,252,122,0.02) 0px,
                rgba(122,252,122,0.02) 1px,
                transparent 1px,
                transparent 4px
            );
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h1>Registro</h1>
        <div id="errorMessage" class="error-message"></div>
        <form id="registroForm">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" required>
            </div>
            <div class="form-group">
                <label for="username">Nombre de Usuario</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="repetirPassword">Confirmar Contraseña</label>
                <input type="password" id="repetirPassword" name="repetirPassword" required>
            </div>
            <div id="mensaje"></div>
            <button type="submit">Registrarse</button>
        </form>
        <div class="login-link">
            <a href="index.html">¿Ya tienes una cuenta? ¡Inicia sesión!</a>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
