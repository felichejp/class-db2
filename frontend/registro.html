<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <div class="register-container">
        <div class="register-form-container">
            <div class="register-form-card">
                <h2>Registro de Usuario</h2>
                <h3>Complete el formulario para crear su cuenta</h3>
                
                <form id="registroForm">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input 
                            type="text" 
                            id="nombre" 
                            name="nombre" 
                            placeholder="Ingrese su nombre" 
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input 
                            type="text" 
                            id="apellido" 
                            name="apellido" 
                            placeholder="Ingrese su apellido" 
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="username">Nombre de usuario</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            placeholder="Elija un nombre de usuario" 
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Ingrese su correo electrónico" 
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Ingrese su contraseña" 
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="repetirPassword">Repetir contraseña</label>
                        <input 
                            type="password" 
                            id="repetirPassword" 
                            name="repetirPassword" 
                            placeholder="Repita su contraseña" 
                            required
                        >
                    </div>
                    
                    <div id="mensaje" class="alert-danger" style="display:none;"></div>
                    
                    <button type="submit" class="register-button">
                        <i class="bi bi-person-plus"></i> Registrarse
                    </button>
                    
                    <div class="additional-links">
                        <a href="login.html" class="login-link">
                            <i class="bi bi-box-arrow-in-right"></i> ¿Ya tienes cuenta? Iniciar Sesión
                        </a>
                        <span class="link-divider">|</span>
                        <a href="index.html" class="back-link">
                            <i class="bi bi-arrow-left"></i> Volver al Inicio
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: Arial, sans-serif;
        background-color: #e8f4f8;
    }
    
    .register-container {
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow-y: auto;
    }

    .register-form-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 2rem 0;
    }

    .register-form-card {
        background-color: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 12px rgba(56, 125, 172, 0.15);
        padding: 2rem;
        width: 100%;
        max-width: 500px;
        border-top: 4px solid #4a6fa5;
    }

    h2 {
        text-align: center;
        margin-bottom: 0.5rem;
        color: #2c3e50;
    }
    
    h3 {
        text-align: center;
        margin-bottom: 1.5rem;
        color: #4a6fa5;
        font-weight: normal;
        font-size: 1.1rem;
    }

    .form-group {
        margin-bottom: 1.2rem;
    }

    label {
        display: block;
        font-size: 0.9rem;
        margin-bottom: 0.5rem;
        color: #4a6fa5;
        font-weight: 500;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
        width: 100%;
        padding: 0.8rem;
        border: 1px solid #c5d8e8;
        border-radius: 4px;
        font-size: 1rem;
        transition: border-color 0.3s;
        background-color: #f8fbfd;
        box-sizing: border-box;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus {
        outline: none;
        border-color: #5e8ab4;
        box-shadow: 0 0 0 2px rgba(94, 138, 180, 0.1);
    }

    .register-button {
        width: 100%;
        padding: 0.8rem;
        background-color: #4a6fa5;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.3s;
        margin-bottom: 1rem;
    }

    .register-button:hover {
        background-color: #395987;
    }
    
    .alert-danger {
        background-color: #fae3e3;
        color: #f75151;
        border: 1px solid #f75151;
        border-radius: 4px;
        padding: 0.8rem;
        margin-bottom: 1rem;
        text-align: center;
    }
    
    .additional-links {
        text-align: center;
        margin-top: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }
    
    .login-link, .back-link {
        color: #4a6fa5;
        text-decoration: none;
        font-size: 0.9rem;
    }
    
    .login-link:hover, .back-link:hover {
        text-decoration: underline;
    }
    
    .link-divider {
        color: #c5d8e8;
        margin: 0 0.5rem;
        display: none;
    }
    
    @media (max-width: 768px) {
        .register-form-card {
            width: 90%;
            padding: 1.5rem;
        }
    }
    
    @media (min-width: 768px) {
        .additional-links {
            flex-direction: row;
            justify-content: center;
            gap: 1rem;
        }
        
        .link-divider {
            display: inline;
        }
    }
</style>
</html>
