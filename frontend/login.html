<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .terminal {
            background-color: #000;
            border: 2px solid #00ff00;
            padding: 2rem;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 15px #00ff00;
        }
        h1 {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }
        td {
            padding: 0.5rem;
            color: #00ff00;
        }
        input {
            width: 100%;
            background-color: black;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 0.5rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
        }
        button {
            padding: 0.75rem;
            background-color: black;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            cursor: pointer;
            margin: 0.25rem;
        }
        button:hover {
            background-color: #003300;
        }
        .green-glow {
            text-shadow: 0 0 5px #00ff00, 0 0 10px #00ff00;
        }
        #mensajeLogin {
            text-align: center;
            margin-top: 1rem;
            color: red;
        }
        a button {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="terminal">
        <h1 class="green-glow">Iniciar Sesión</h1>
        
        <form id="loginForm">
            <table border="1">
                <tr>
                    <td><label for="loginEmail" class="green-glow">Email:</label></td>
                    <td><input type="email" id="loginEmail" name="loginEmail" required></td>
                </tr>
                <tr>
                    <td><label for="loginPassword" class="green-glow">Password:</label></td>
                    <td><input type="password" id="loginPassword" name="loginPassword" required></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <button type="submit" class="green-glow">Iniciar Sesión</button>
                        <button type="button" onclick="limpiarLogin()" class="green-glow">Limpiar</button>
                    </td>
                </tr>
            </table>
        </form>
        
        <div id="mensajeLogin"></div>
        
        <br>
        <a href="index.html">
            <button type="button" class="green-glow">Volver al Inicio</button>
        </a>
        
        <br><br>
        <a href="registro.html">
            <button type="button" class="green-glow">¿No tienes cuenta? Registrarse</button>
        </a>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
