<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <div class="login-container">
        <div class="login-form-container">
            <div class="login-form-card">
                <h2>Iniciar Sesión</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input 
                            type="email" 
                            id="loginEmail" 
                            name="loginEmail" 
                            placeholder="Ingrese su email" 
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="loginPassword">Contraseña</label>
                        <input 
                            type="password" 
                            id="loginPassword" 
                            name="loginPassword" 
                            placeholder="Ingrese su contraseña" 
                            required
                        >
                    </div>
                    
                    <div id="mensajeLogin" class="alert-danger" style="display:none;"></div>
                    
                    <button type="submit" class="login-button">
                        <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
                    </button>
                    
                    <div class="additional-links">
                        <a href="index.html" class="back-link">
                            <i class="bi bi-arrow-left"></i> Volver al Inicio
                        </a>
                        <span class="link-divider">|</span>
                        <a href="registro.html" class="register-link">
                            <i class="bi bi-person-plus"></i> ¿No tienes cuenta? Regístrate
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Display error message if present in URL parameters
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            if (error) {
                const errorElement = document.getElementById('mensajeLogin');
                errorElement.textContent = error;
                errorElement.style.display = 'block';
            }
        }
    </script>
</body>
</html>

        box-shadow: 0 4px 12px rgba(56, 125, 172, 0.15);
        padding: 2rem;
        width: 100%;
        max-width: 400px;
        border-top: 4px solid #4a6fa5;
    }

    h2 {
        text-align: center;
        margin-bottom: 1.5rem;
        color: #2c3e50;
    }

    .form-group {
        margin-bottom: 1.2rem;
    }

    label {
        display: block;
        font-size: 0.9rem;
        margin-bottom: 0.5rem;
        color: #4a6fa5;
        font-weight: 500;
    }

    input[type="email"],
    input[type="password"] {
        width: 100%;
        padding: 0.8rem;
        border: 1px solid #c5d8e8;

    input[type="email"]:focus,

    }

    .login-button {
        width: 100%;
        padding: 0.8rem;
        background-color: #4a6fa5;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.3s;
        margin-bottom: 1rem;
    }

    .login-button:hover {

    }
    
    .alert-danger {
