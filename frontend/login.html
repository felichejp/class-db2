<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <div class="navbar">
      <span class="navbar-brand">Inicio de sesion</span>
      <span class="navbar-text"><i class="bi bi-water"></i></span>
    </div>
    <div class="login-card">
      <div class="card-body">
        <div class="text-center">
          <h4 class="card-title">Iniciar Sesión</h4>
          <h5 class="card-title">Bienvenido al sistema</h5>
          <hr />
        </div>
        <form id="loginForm">
          <div class="form-floating">
            <input type="email" id="loginEmail" name="loginEmail" class="form-control" placeholder="Ingrese su email" required>
            <label for="loginEmail">Email</label>
          </div>
          <div class="form-floating">
            <input type="password" id="loginPassword" name="loginPassword" class="form-control" placeholder="Ingrese su contraseña" required>
            <label for="loginPassword">Contraseña</label>
          </div>
          <div id="mensajeLogin" class="alert-danger" style="display:none;"></div>
          <div class="text-center mt-3">
            <button class="btn btn-outline-success" type="submit">
              <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
            </button>
          </div>
          <div class="text-center mt-3">
            <button class="btn btn-outline-primary" type="button" onclick="window.location.href='registro.html'">
              <i class="bi bi-person-plus"></i> Registrarse
            </button>
          </div>
          <div class="text-center mt-3">
            <button class="btn btn-outline-primary" type="button" onclick="window.location.href='index.html'">
              <i class="bi bi-arrow-left"></i> Volver al Inicio
            </button>
          </div>
        </form>
      </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
<style>
