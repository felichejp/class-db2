<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido</title>
    <style>
        body {
            font-family: 'Share Tech Mono', 'Consolas', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #101a12;
            color: #7afc7a;
        }
        .welcome-container {
            background: rgba(16, 26, 18, 0.98);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 24px #0f3d0f, 0 0 2px #7afc7a inset;
            width: 100%;
            max-width: 400px;
            border: 1.5px solid #3a5c3a;
            text-align: center;
        }
        h1 {
            margin-bottom: 1.5rem;
            color: #7afc7a;
            text-shadow: 0 0 8px #3a5c3a;
        }
        .welcome-message {
            margin-bottom: 2rem;
            font-size: 1.1rem;
            color: #a6ffb6;
            text-shadow: 0 0 2px #3a5c3a;
        }
        .button-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        button {
            padding: 0.75rem 1.5rem;
            background: #183c18;
            color: #7afc7a;
            border: 1.5px solid #3a5c3a;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            text-shadow: 0 0 4px #3a5c3a;
            transition: background 0.2s, color 0.2s;
        }
        button.logout {
            background: #224d22;
            color: #ff4f4f;
            border-color: #3a5c3a;
        }
        button:hover {
            background: #224d22;
            color: #a6ffb6;
        }
        /* Efecto scanlines sutil */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(122,252,122,0.02) 0px,
                rgba(122,252,122,0.02) 1px,
                transparent 1px,
                transparent 4px
            );
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <h1>Bienvenido</h1>
        <div id="welcomeMessage" class="welcome-message">
            ¡Hola <span id="username"></span>! Has iniciado sesión correctamente.
        </div>
        <div class="button-container">
            <button class="logout" onclick="logout()">Cerrar Sesión</button>
        </div>
    </div>

    <script>
        function logout() {
            // Limpia cualquier dato de sesión/localStorage
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = 'index.html';
        }
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const username = urlParams.get('username');
            if (username) {
                document.getElementById('username').textContent = username;
            }
        }
    </script>
</body>
</html>
